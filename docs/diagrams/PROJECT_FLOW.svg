<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CS2 Match Analyzer — High-level project flow</title>
  <desc id="desc">Shows the Streamlit and command-line entry points, shared demo parsing and analysis pipeline, report generation, and HTML and text outputs.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10182b"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1c2941"/><stop offset="1" stop-color="#151f34"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7186aa"/></marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #e8eef9; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; fill: #a78bfa; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -.6px; }
      .subtitle { font-size: 16px; fill: #94a3b8; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; fill: #9aabc5; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #b7c3d8; }
      .small { font-size: 12px; fill: #8999b4; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c4b5fd; }
      .panel { fill: url(#panel); stroke: #33435f; stroke-width: 1.2; }
      .inner { fill: #111a2d; stroke: #31415d; stroke-width: 1; }
      .arrow { fill: none; stroke: #7186aa; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-accent { fill: none; stroke: #a78bfa; stroke-width: 2.5; marker-end: url(#arrowAccent); }
      .dashed { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="250" fill="#7c3aed" opacity=".055"/>
  <circle cx="80" cy="940" r="260" fill="#0ea5e9" opacity=".035"/>
  <path d="M64 118H1536" stroke="#34425c"/>
  <text x="72" y="48" class="eyebrow">PROJECT MAP / HIGH LEVEL</text>
  <text x="72" y="91" class="title">CS2 Match Analyzer</text>
  <text x="520" y="87" class="subtitle">From demo upload or CLI input to a player-focused match report</text>

  <!-- Entry points -->
  <text x="72" y="159" class="section">ENTRY POINTS</text>
  <g filter="url(#shadow)">
    <rect x="72" y="180" width="330" height="325" rx="18" class="panel"/>
    <rect x="72" y="180" width="330" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="98" y="222" class="tag">01 / STREAMLIT GUI</text>
    <text x="98" y="255" class="head">app.py</text>
    <text x="98" y="281" class="body">Upload a .dem file</text>
    <path d="M108 294v22" class="arrow"/>
    <rect x="98" y="320" width="278" height="54" rx="10" class="inner"/>
    <text x="116" y="343" class="body">Scan roster with Awpy</text>
    <text x="116" y="361" class="small">Build the player dropdown</text>
    <path d="M108 376v18" class="arrow"/>
    <rect x="98" y="398" width="278" height="54" rx="10" class="inner"/>
    <text x="116" y="421" class="body">Select player identity</text>
    <text x="116" y="439" class="small">Name or Steam ID from demo</text>
    <text x="98" y="480" class="small">Calls analysis_wrapper.py</text>

    <rect x="72" y="555" width="330" height="190" rx="18" class="panel"/>
    <rect x="72" y="555" width="330" height="5" rx="2.5" fill="#38bdf8"/>
    <text x="98" y="598" class="tag">02 / COMMAND LINE</text>
    <text x="98" y="632" class="head">report.py</text>
    <text x="98" y="660" class="body">--demo &lt;demo.dem&gt;</text>
    <text x="98" y="684" class="body">--player &lt;name or Steam ID&gt;</text>
    <text x="98" y="718" class="small">Direct route for repeat reports</text>
  </g>

  <!-- Shared processing -->
  <text x="464" y="159" class="section">SHARED REPORT PIPELINE</text>
  <g filter="url(#shadow)">
    <rect x="464" y="180" width="682" height="565" rx="18" class="panel"/>
    <rect x="464" y="180" width="682" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="492" y="222" class="tag">report.py → cs2_report/pipeline.py</text>
    <text x="492" y="253" class="head">Load demo &amp; resolve player</text>
    <text x="492" y="279" class="body">demo.py → Awpy tables → player shots and identity</text>
    <path d="M805 292v25" class="arrow-accent"/>

    <rect x="492" y="326" width="626" height="350" rx="14" class="inner"/>
    <text x="516" y="360" class="section">ANALYSIS MODULES</text>
    <rect x="516" y="382" width="278" height="100" rx="11" fill="#18243a" stroke="#354866"/>
    <text x="536" y="412" class="head" font-size="16">Weapon movement</text>
    <text x="536" y="438" class="body">weapons.py · snapshots, moving shots</text>
    <text x="536" y="460" class="small">Rifle / SMG / pistol / sniper rates</text>
    <rect x="814" y="382" width="278" height="100" rx="11" fill="#18243a" stroke="#354866"/>
    <text x="834" y="412" class="head" font-size="16">Aim on kills</text>
    <text x="834" y="438" class="body">aim.py · shots matched to kills</text>
    <text x="834" y="460" class="small">Average deviation and weapon summary</text>
    <rect x="516" y="500" width="278" height="100" rx="11" fill="#18243a" stroke="#354866"/>
    <text x="536" y="530" class="head" font-size="16">Hit map</text>
    <text x="536" y="556" class="body">hits.py · damage hitgroups</text>
    <text x="536" y="578" class="small">Weapon-filtered bullet impact visual</text>
    <rect x="814" y="500" width="278" height="100" rx="11" fill="#18243a" stroke="#354866"/>
    <text x="834" y="530" class="head" font-size="16">Utility &amp; match context</text>
    <text x="834" y="556" class="body">flashes.py · utility_deaths.py</text>
    <text x="834" y="578" class="small">Blinds, deaths, stats and map info</text>
    <text x="516" y="638" class="small">Shared labels and thresholds: constants.py</text>
    <text x="814" y="638" class="small">archetype.py: experimental; result not yet in report</text>

    <rect x="492" y="695" width="626" height="34" rx="9" fill="#152c3a" stroke="#256274"/>
    <text x="510" y="717" class="small">Data work uses Polars; Awpy reads Counter-Strike demo data.</text>
  </g>

  <!-- Rendering and outputs -->
  <text x="1202" y="159" class="section">REPORT &amp; DELIVERY</text>
  <g filter="url(#shadow)">
    <rect x="1202" y="180" width="326" height="565" rx="18" class="panel"/>
    <rect x="1202" y="180" width="326" height="5" rx="2.5" fill="#34d399"/>
    <text x="1228" y="222" class="tag" fill="#6ee7b7">03 / RENDER</text>
    <text x="1228" y="255" class="head">Build report</text>
    <text x="1228" y="284" class="body">rendering/html.py</text>
    <text x="1228" y="307" class="body">rendering/charts.py</text>
    <text x="1228" y="346" class="small">Analysis values become:</text>
    <rect x="1228" y="365" width="274" height="80" rx="11" fill="#102b30" stroke="#1d6657"/>
    <text x="1248" y="397" class="head">HTML report</text>
    <text x="1248" y="423" class="small">Visuals, diagnosis, details</text>
    <rect x="1228" y="460" width="274" height="80" rx="11" fill="#14253c" stroke="#365982"/>
    <text x="1248" y="492" class="head">Text report</text>
    <text x="1248" y="518" class="small">Readable plain-text summary</text>
    <path d="M1365 548v22" class="arrow"/>
    <text x="1228" y="598" class="body">GUI</text>
    <text x="1270" y="598" class="small">Preview + download HTML</text>
    <text x="1228" y="626" class="body">CLI</text>
    <text x="1270" y="626" class="small">Save both beside the demo</text>
    <text x="1228" y="700" class="small">HTML embeds the interactive hit map</text>
  </g>

  <!-- Connections -->
  <path d="M402 430H434V266H464" class="arrow-accent"/>
  <path d="M402 648H434V266H464" class="arrow"/>
  <path d="M1146 465H1202" class="arrow-accent"/>
  <text x="448" y="770" class="small">Both entry points use the same analysis and report generation logic.</text>

  <!-- Side notes -->
  <rect x="72" y="805" width="1456" height="150" rx="17" fill="#111a2d" stroke="#2b3a55"/>
  <text x="100" y="845" class="tag">PROJECT STRUCTURE</text>
  <text x="100" y="884" class="body">app.py</text><text x="183" y="884" class="small">Streamlit upload, roster selection, progress, preview and download</text>
  <text x="100" y="916" class="body">analysis_wrapper.py</text><text x="258" y="916" class="small">Connects the GUI to the canonical report.py command</text>
  <text x="810" y="884" class="body">cs2_report/analysis/</text><text x="985" y="884" class="small">Feature-specific match calculations</text>
  <text x="810" y="916" class="body">cs2_report/rendering/</text><text x="1000" y="916" class="small">HTML template and Plotly chart generation</text>
  <text x="72" y="993" class="small">CS2 MATCH ANALYZER  /  HIGH-LEVEL FLOW  /  PROJECT ROOT</text>
</svg>
